[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaivid-tui"
version = "1.2.0"
description = "Terminal client for the Plaivid PVM Control Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Plaivid maintainers" }]
dependencies = ["textual>=0.47"]

[project.scripts]
plaivid = "plaivid_cli.engine_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plaivid_cli*"]
exclude = ["plaivid_cli.legacy*"]
