[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaivid-cli"
version = "0.4.0"
description = "Linux-local terminal client for Plaivid PVM virtual machines"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Plaivid CLI maintainers" }]
dependencies = ["textual>=0.47"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
  "build>=1.2",
]

[project.scripts]
plaivid = "plaivid_cli.bootstrap:main"

[tool.setuptools.packages.find]
include = ["plaivid_cli*"]
exclude = ["plaivid_cli.legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "tests/smoke.py",
  "plaivid_cli/legacy",
  "plaivid_cli/legacy/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["plaivid_cli"]
omit = [
  "plaivid_cli/legacy/*",
  "plaivid_cli/legacy/**/*",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["plaivid_cli"]
exclude = [
  ".venv",
  "tests",
  "plaivid_cli/legacy/**",
]
