[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaivid-ui"
version = "1.3.0"
description = "Textual user interface for the Plaivid PVM Control Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Plaivid maintainers" }]
dependencies = ["textual>=0.47"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyright>=1.1", "build>=1.2"]

[project.scripts]
plaivid = "plaivid_ui.engine_client.cli:main"

[tool.setuptools]
package-dir = {"" = "tui/src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["tui/src"]
include = ["plaivid_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tui/src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/history", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP046", "UP047"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"
include = ["tui/src/plaivid_ui"]
exclude = ["build", "dist", "*.egg-info", "tests"]
